name: shellcheck

on:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run shellcheck
        # Check every tracked file with a shell shebang or a
        # `# shellcheck shell=` directive, so new scripts are picked up
        # automatically. shellcheck is preinstalled on GitHub's runners.
        run: |
          shellcheck --version
          git ls-files -z \
            | xargs -0 grep -lZE '^(#!.*\<(ba)?sh\>|# shellcheck shell=)' \
            | xargs -0 -r shellcheck
